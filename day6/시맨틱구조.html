<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시맨틱구조</title>
</head>
<body>
    <header>
        <h1>LOGO</h1>
        <nav>
            <ul>
                <li>
                    <a href="#">회사소개</a>
                </li>
                <li>
                    <a href="#">회사정보</a>
                </li>
                <li>
                    <a href="#">contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>이부분은 해변에 대한 부분입니다</h2>
            <img src="../day5/beach-2562563_1280.jpg" alt="해변 사진">
        </section>

        <section>
            <h2>이부분은 우주먼지에 대한 부분입니다</h2>
            <img src="../day3/우주먼지.png" alt="우주먼지 사진">
        </section>

        <article>
            <section></section>
            <section></section>
        </article>

        <section>
            <article></article>
            <article></article>
        </section>
        <!-- article과 section을 같이사용하면 헷갈릴수있다. section만 사용해도된다.
         혹은 둘중 하나로 사용하면 된다. -->
    </main>

    <aside>
        <h3>사이드입니다.</h3>
        <p>aside 태그는 주로 문서의 메인 내용과 관련되지 않은 별도로 분리된 추가적인 정보를 제공하는 데에 사용된다. 예를들면 광고같은거.</p>
        <p>레이아웃의 배치를 사이드로 빼고싶으면 css의 도움을 받아야한다.</p>
    </aside>
    <!-- aside는 중요하지않은 정보를 넣는공간 Ex: 광고자리 -->

    <footer>
        우리회사정보~~~ 사업자번호 주소 전화번호 등등
    </footer>
</body>
</html>
