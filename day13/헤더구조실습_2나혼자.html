<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>헤더구조실습_네이버메인구조영역</title>
    <style>
        body {
            margin: 0;
            background: #fff;
            text-align: center;
        }
        .search_bar {
            width: 80%;
            height: 60px;
            background-color: #a8ff60;
            border-radius: 20px;
            margin: 30px auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: 600;
        }

        .menu_container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 0 20px;
        }

        .menu_box {
            width: 70px;
            height: 70px;
            background: yellow;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 5px;
        }

         .menu-box span {
            margin-top: 8px;
            font-size: 14px;
            color: #000;
            font-weight: 500;
        }


    </style>
</head>

</body>

</html>
